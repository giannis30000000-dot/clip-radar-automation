name: Clip Radar Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Runs 4x/day to catch fresh clips.
    - cron: '15 5,10,15,20 * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      STREAMERS: xqc,kaicenat,jynxzi,caseoh_
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run fresh clip scan
        run: python scanner.py
