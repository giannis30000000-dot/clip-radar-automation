name: Clip Radar Automatic Acquisition Test

on:
  workflow_dispatch:
  schedule:
    # Hourly discovery so fresh viral moments are detected early.
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: clip-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      STREAMERS: xqc,kaicenat,jynxzi,caseoh_,stableronaldo,zackrawrr,sodapoppin,lacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Install ffmpeg for source validation and editing
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Restore persistent clip and publication ledgers
        uses: actions/cache/restore@v4
        with:
          path: state
          key: clip-radar-dedupe-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            clip-radar-dedupe-${{ github.ref_name }}-
      - name: Run automatic acquisition, edit, QC and Metricool dry run
        env:
          CLIP_RADAR_STATE_FILE: state/processed_clips.json
          CLIP_RADAR_PUBLICATION_STATE_FILE: state/publications.json
          CLIP_RADAR_OUTPUT_DIR: output
          # The cloud milestone creates a complete plan but never sends a
          # Metricool request. Live publishing requires a separate deliberate
          # workflow/configuration change after this plan is inspected.
          PUBLISHING_ENABLED: 'false'
          PUBLISHING_DRY_RUN: 'true'
          METRICOOL_NETWORKS: 'tiktok,instagram'
          ENABLE_YOUTUBE_PUBLISHING: 'false'
          PRODUCTION_TIMEZONE: 'Europe/Athens'
          PRODUCTION_SLOTS: '12:00,15:30,19:00,22:00'
          MAX_OUTPUTS: '1'
          MAX_CANDIDATES: '20'
          WHISPER_MODEL: tiny
        run: python orchestrator.py
      - name: Save persistent clip and publication ledgers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: clip-radar-dedupe-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload original acquired landscape MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-radar-source-${{ github.run_id }}
          path: output/sources/*_landscape.mp4
          if-no-files-found: warn
      - name: Upload final edited vertical MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-radar-final-${{ github.run_id }}
          path: output/final/*_clipradar_vertical.mp4
          if-no-files-found: warn
      - name: Upload run summary and QC metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-radar-run-${{ github.run_id }}
          path: output/run_summary.json
          if-no-files-found: warn
      - name: Upload Metricool dry-run plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-radar-publishing-dry-run-${{ github.run_id }}
          path: output/publishing_plan.json
          if-no-files-found: warn
